name: Deploy to TestFlight

# Tag-triggered, not merge-triggered: shipping to TestFlight is a deliberate act.
# Merging a doc fix should not cost build minutes or add a build for testers to
# wade through. Cut a release with:
#
#   git tag v1.0.1 && git push origin v1.0.1
#
# Requires the GitHub repository to be connected to the EAS project — without
# that link the push trigger never reaches EAS and nothing runs.
on:
  push:
    tags: ['v*']

# A newer tag supersedes an in-flight run.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: true

defaults:
  image: sdk-57

jobs:
  # Re-run the gate here rather than trusting that main was green when the tag
  # was cut: a tag can point at any commit, including one that never went
  # through a pull request.
  check:
    name: Typecheck, lint and test
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Test
        run: npx jest

  build_ios:
    name: Build iOS
    type: build
    needs: [check]
    params:
      platform: ios
      profile: production
      message: ${{ github.ref }}

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
